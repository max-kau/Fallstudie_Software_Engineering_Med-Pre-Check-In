name: User Story
description: Erstelle eine agile Aufgabe für das Board
title: "US: "
labels: ["user-story", "mvp"]

body:
  - type: input
    id: user_story_id
    attributes:
      label: User Story ID
      placeholder: "z. B. US1, US2, US3"
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Rolle
      placeholder: "z. B. Patient, Praxisteam"
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      placeholder: "Als Patient möchte ich ..., damit ..."
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Aufgabe
      placeholder: "Was soll umgesetzt werden?"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Frontend
        - Backend
        - Datenbank
        - Testing
        - Dokumentation
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priorität
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Akzeptanzkriterien
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      value: |
        - [ ] Funktion umgesetzt
        - [ ] getestet
        - [ ] Review durchgeführt
        - [ ] im Board auf Done gesetzt
